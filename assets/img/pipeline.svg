<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">iota analysis pipeline</title>
  <desc id="pipeline-desc">Load a sample, scan the field, detect targets, and export counts.</desc>
  <defs>
    <linearGradient id="dish-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3344"/>
      <stop offset="100%" stop-color="#1a2230"/>
    </linearGradient>
    <linearGradient id="scan-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243044"/>
      <stop offset="100%" stop-color="#151d2a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa8bc"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .frame { fill: #141c28; stroke: rgba(154,168,188,.22); stroke-width: 1.2; }
    .label { font: 600 13px Sora, system-ui, sans-serif; fill: #eef1f6; }
    .caption { font: 400 11px Sora, system-ui, sans-serif; fill: #9aa8bc; }
    .step { font: 600 10px Sora, system-ui, sans-serif; fill: #c9a227; letter-spacing: .08em; }
    .arrow { stroke: #9aa8bc; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .colony { fill: #7b6fa8; opacity: .9; }
    .colony-hit { fill: #c9a227; opacity: .95; }
    .grid { stroke: rgba(201,162,39,.35); stroke-width: .8; fill: none; }
    .mask { fill: #eef1f6; opacity: .92; }
    .row { fill: rgba(154,168,188,.12); }
  </style>

  <!-- Step 1: Load -->
  <g transform="translate(16 24)">
    <rect class="frame" x="0" y="0" width="200" height="148" rx="8"/>
    <text class="step" x="16" y="22">01 � LOAD</text>
    <circle cx="100" cy="82" r="46" fill="url(#dish-fill)" stroke="rgba(154,168,188,.35)"/>
    <circle cx="72" cy="70" r="3.2" class="colony"/>
    <circle cx="88" cy="64" r="2.4" class="colony"/>
    <circle cx="110" cy="72" r="4.1" class="colony"/>
    <circle cx="126" cy="86" r="2.8" class="colony"/>
    <circle cx="94" cy="92" r="3.5" class="colony"/>
    <circle cx="118" cy="98" r="2.2" class="colony"/>
    <text class="label" x="16" y="134">Load &amp; focus</text>
    <text class="caption" x="16" y="150">Place dish or tray</text>
  </g>

  <path class="arrow" d="M228 96 H252"/>

  <!-- Step 2: Scan -->
  <g transform="translate(260 24)">
    <rect class="frame" x="0" y="0" width="200" height="148" rx="8"/>
    <text class="step" x="16" y="22">02 � SCAN</text>
    <rect x="44" y="44" width="112" height="72" rx="4" fill="url(#scan-fill)" stroke="rgba(154,168,188,.25)"/>
    <path class="grid" d="M44 68 H156 M44 92 H156 M68 44 V116 M92 44 V116 M116 44 V116"/>
    <path d="M52 52 H148 V108" stroke="#c9a227" stroke-width="1.6" fill="none" stroke-dasharray="4 3" opacity=".85"/>
    <circle cx="60" cy="60" r="2.2" class="colony"/>
    <circle cx="104" cy="74" r="3" class="colony"/>
    <circle cx="132" cy="96" r="2.5" class="colony"/>
    <text class="label" x="16" y="134">Scan the field</text>
    <text class="caption" x="16" y="150">Tile &amp; stitch mosaic</text>
  </g>

  <path class="arrow" d="M472 96 H496"/>

  <!-- Step 3: Detect -->
  <g transform="translate(504 24)">
    <rect class="frame" x="0" y="0" width="200" height="148" rx="8"/>
    <text class="step" x="16" y="22">03 � DETECT</text>
    <rect x="44" y="44" width="112" height="72" rx="4" fill="#10161f" stroke="rgba(154,168,188,.25)"/>
    <circle cx="78" cy="72" r="14" fill="none" stroke="#c9a227" stroke-width="1.6" filter="url(#glow)"/>
    <circle cx="78" cy="72" r="3" class="colony-hit"/>
    <circle cx="122" cy="96" r="11" fill="none" stroke="#c9a227" stroke-width="1.6"/>
    <circle cx="122" cy="96" r="2.6" class="colony-hit"/>
    <circle cx="98" cy="58" r="2.2" class="colony" opacity=".45"/>
    <text class="label" x="16" y="134">Detect targets</text>
    <text class="caption" x="16" y="150">Tune size &amp; contrast</text>
  </g>

  <path class="arrow" d="M716 96 H740"/>

  <!-- Step 4: Export -->
  <g transform="translate(748 24)">
    <rect class="frame" x="0" y="0" width="196" height="148" rx="8"/>
    <text class="step" x="16" y="22">04 � COUNT</text>
    <rect x="36" y="48" width="124" height="64" rx="4" fill="#10161f" stroke="rgba(201,162,39,.35)"/>
    <rect x="36" y="48" width="124" height="14" rx="4" fill="rgba(201,162,39,.25)"/>
    <rect class="row" x="42" y="68" width="88" height="6" rx="2"/>
    <rect class="row" x="42" y="80" width="72" height="6" rx="2"/>
    <rect class="row" x="42" y="92" width="96" height="6" rx="2"/>
    <text x="148" y="78" class="step" style="font-size:16px;fill:#c9a227">47</text>
    <text class="label" x="16" y="134">Count &amp; export</text>
    <text class="caption" x="16" y="150">Totals, coords, images</text>
  </g>
</svg>
